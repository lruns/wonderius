<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wonderius</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div class="frame"></div>
  <header class="title min" id="head">
    <h1 id="h1"></h1>
    <p id="tagline"></p>
  </header>
  <div id="stage"></div>
  <p id="map-hint" class="map-hint"></p>
  <div class="map-controls">
    <button id="zoom-in" type="button">+</button>
    <button id="zoom-out" type="button">−</button>
    <button id="zoom-home" type="button">⌂</button>
  </div>
  <button id="lang" class="lang" type="button"></button>
  <section id="card" class="card" hidden></section>
  <div class="dock">
    <button id="random" class="rand" type="button"></button>
    <div class="dock-row">
      <div class="legend-slot">
        <div id="legend-plate" class="legend-plate" hidden>
          <button type="button" data-filter="all" aria-pressed="true">
            <svg class="swatch" viewBox="-18 -18 36 36" aria-hidden="true">
              <circle class="disc" r="11"></circle>
            </svg>
            <span id="legend-all"></span>
          </button>
          <button type="button" data-filter="model" aria-pressed="false">
            <svg class="swatch" viewBox="-18 -18 36 36" aria-hidden="true">
              <circle class="gold" r="15.5"></circle>
              <circle class="disc" r="11"></circle>
            </svg>
            <span id="legend-model"></span>
          </button>
          <button type="button" data-filter="pile" aria-pressed="false">
            <svg class="swatch" viewBox="-18 -18 36 36" aria-hidden="true">
              <circle class="disc" r="11"></circle>
              <g transform="translate(-7,7)">
                <circle class="badge" r="5.5"></circle>
                <text class="plus" dy="0.35em">+</text>
              </g>
            </svg>
            <span id="legend-pile"></span>
          </button>
        </div>
        <button type="button" class="foot-bar" id="legend" aria-expanded="false" aria-controls="legend-plate"></button>
      </div>
      <footer class="credit" id="foot">
        <p class="credit-body" id="credit-body" hidden></p>
        <button type="button" class="foot-bar" id="credit-bar" aria-expanded="false"></button>
      </footer>
    </div>
  </div>
  <div id="cluster" class="cluster" hidden></div>
</div>
<div id="lb" class="lb" hidden></div>
<script src="bundle.js"></script>
</body>
</html>
